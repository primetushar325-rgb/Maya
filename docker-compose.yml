services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: maya
      POSTGRES_USER: maya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maya_local_password_change_me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maya -d maya"]
      interval: 5s
      timeout: 4s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-maya-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-maya-minio-local-secret}
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-maya-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-maya-minio-local-secret}
      S3_BUCKET: ${S3_BUCKET:-maya-streams}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 2; done;
      mc mb --ignore-existing "local/$$S3_BUCKET"
    restart: "no"

  api:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "start:api"]
    environment:
      NODE_ENV: production
      PORT: 4000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_MODE: "false"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Workspace Admin}
      DATABASE_URL: postgres://maya:${POSTGRES_PASSWORD:-maya_local_password_change_me}@postgres:5432/maya
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-local-only-change-this-to-a-random-secret-at-least-32-characters}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-local-only-encryption-key-change-before-deploying}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-maya-streams}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-maya-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-maya-minio-local-secret}
      S3_FORCE_PATH_STYLE: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4000/api/youtube/callback}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-5368709120}
      DATA_DIR: /app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "4000:4000"
    volumes:
      - maya-data:/app/data

  worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "start:worker"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://maya:${POSTGRES_PASSWORD:-maya_local_password_change_me}@postgres:5432/maya
      REDIS_URL: redis://redis:6379
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-local-only-encryption-key-change-before-deploying}
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-maya-streams}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-maya-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-maya-minio-local-secret}
      S3_FORCE_PATH_STYLE: "true"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4000/api/youtube/callback}
      DATA_DIR: /app/data
      FFMPEG_BIN: ffmpeg
      FFPROBE_BIN: ffprobe
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      MAX_RECONNECT_ATTEMPTS: ${MAX_RECONNECT_ATTEMPTS:-6}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - maya-data:/app/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
  maya-data:
